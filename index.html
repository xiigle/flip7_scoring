KP=k=>{if(sel.has(k))sel.delete(k);else{sel.add(k);if(k=='p7')[...sel].forEach(x=>{if(x!='p7'&&/^[nmdl]/.test(x))sel.delete(x)});if(k=='n7')sel.delete('p7')}upd()};
return modal(`<h3>${esc(name)}</h3><div id=hl class=cds>${cards.map(c=>`<button class=cd data-k="${c[0]}" style="--cc:${c[2]}">${c[1]}</button>`).join('')}</div><p><b id=ht style="font-size:2.2rem">0</b> ${t('pts')} <span id=hf style="visibility:hidden">🎉 Flip 7 +15</span></p><p id=hn class=hn style="display:none">${t('f7n')}</p>`,[{l:t('cancel'),v:0},{l:t('use'),v:1,c:'p'}]).then(ok=>ok?calc()[0]:null)}
async function roundModal(idx){const g=S.game,ed=idx!=null;let v=ed?[...g.rounds[idx]]:g.players.map(()=>0);
for(;;){const x=await modal(`<h3>${ed?t('editr')+' '+(idx+1):t('round')+' '+(g.rounds.length+1)}</h3>`+g.players.map((p,i)=>`<div class=rr style="border-left-color:${C[i%8]}"><b>${esc(p)}</b>${!TOUCH&&g.neg?`<button class=sg data-s=${i}>±</button>`:''}${TOUCH?`<button class=inp data-x=k${i}>${v[i]}</button>`:`<input inputmode=numeric autocomplete=off data-r=${i} value="${v[i]}">`}<button class=sg data-x=h${i}>🧮</button></div>`).join(''),[{l:t('cancel'),v:'c'},{l:t('save'),v:'s',c:'p'}]);
if(!TOUCH)document.querySelectorAll('#modal [data-r]').forEach(f=>v[+f.dataset.r]=parseInt(f.value)||0);
if(x=='c')return;if(x=='s'){const lim=g.ver=='v'?100:175,bad=g.players.filter((_,i)=>Math.abs(v[i])>lim);if(!bad.length)break;if(await modal(`<p>${t('hi',bad.map(esc).join(', ')).replace('%n',lim)}</p>`,[{l:t('fix'),v:0},{l:t('anyway'),v:1,c:'p'}]))break;continue}const i=+x.slice(1);
const n=await(x[0]=='k'?keypad(v[i],g.neg,g.players[i]):helper(g.players[i],g));if(n!=null)v[i]=n}
ed?g.rounds[idx]=v:g.rounds.push(v);render();
const T0=tot(g),mx=Math.max(...T0);if(mx>=g.target){const w=g.players.filter((_,i)=>T0[i]==mx);
const c=await modal(`<h3>🏆</h3><p>${w.length>1?t('tie'):t('win',esc(w[0]))}</p>`,[{l:t('cont'),v:0},{l:t('newg'),v:1,c:'p'}]);if(c){S.game=null;render()}}}
async function hist(){const g=S.game;const x=await modal(`<h3>${t('hist')}</h3>`+(g.rounds.length?`<table><tr><th>#</th>${g.players.map(p=>`<th>${esc(p).slice(0,7)}</th>`).join('')}<th></th></tr>${g.rounds.map((r,k)=>`<tr><td>${k+1}</td>${r.map(v=>`<td>${v}</td>`).join('')}<td><button data-x=e${k}>✏️</button><button data-x=d${k}>🗑️</button></td></tr>`).join('')}</table>`:`<p>${t('norounds')}</p>`),[{l:t('close'),v:''}]);
if(x[0]=='e')roundModal(+x.slice(1));if(x[0]=='d'&&await ask(t('delr'))){g.rounds.splice(+x.slice(1),1);render()}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
if(a=='lang'){S.lang=v}
else if(a=='sel'){S.sel.push(v)}
else if(a=='unsel'){S.sel=S.sel.filter(n=>n!=v)}
else if(a=='del'){if(!await ask(t('del',v)))return;S.names=S.names.filter(n=>n!=v)}
else if(a=='add'){const n=$('#nn').value.trim();if(!n)return;if(!S.names.includes(n))S.names.push(n);if(!S.sel.includes(n))S.sel.push(n)}
else if(a=='neg'){S.neg=!S.neg}
else if(a=='ver'){S.ver=v;if(v!='v')S.neg=false}
else if(a=='start'){S.target=parseInt($('#tg').value)||200;if(S.sel.length<2){modal(`<p>${t('min')}</p>`,[{l:t('ok'),v:0,c:'p'}]);return}
S.game={players:[...S.sel],target:S.target,neg:S.ver=='v'&&S.neg,ver:S.ver,rounds:[]}}
else if(a=='inst'){if(IOS){await modal(`<h3>📲 ${t('inst')}</h3><ol class=io>${t('ios').split('|').map(s=>`<li>${s}</li>`).join('')}</ol>`,[{l:t('ok'),v:0,c:'p'}]);return}if(DP){DP.prompt();await DP.userChoice.catch(()=>{});DP=null}}
else if(a=='round')return roundModal();else if(a=='hist')return hist();
else if(a=='menu'){if(!await ask(t('quit')))return;S.game=null}
render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='nn')document.querySelector('[data-a=add]').click()});
document.addEventListener('input',e=>{if(e.target.id=='tg')S.target=parseInt(e.target.value)||200});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!='INPUT')e.preventDefault()});
document.addEventListener('selectstart',e=>{if(e.target.tagName!='INPUT')e.preventDefault()});
$('#modal').addEventListener('touchmove',e=>{if(!e.target.closest('.box'))e.preventDefault()},{passive:false});
render();
</script></body></html>
